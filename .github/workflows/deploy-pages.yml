# Déploiement GitHub Pages du site Media Vote.
#
# Le dépôt est publié tel quel : Media Vote est du HTML statique écrit à la
# main, sans étape de fabrication.
#
# NG Couvreur vivait ici le temps de la préparation. Il a son propre dépôt
# (rockandberg/ng-couvreur) et son propre domaine depuis le 28/10/2026 ;
# les étapes qui le construisaient ont donc été retirées.
name: Déploiement Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contrôler le résultat
        run: |
          set -e
          test -f index.html
          echo "Pages publiées : $(find . -name '*.html' -not -path './.git/*' | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
